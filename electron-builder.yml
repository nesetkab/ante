appId: dev.ante.browser
productName: Ante
copyright: Copyright © 2026 Neset Kablan
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
protocols:
  - name: Web URL
    schemes:
      - http
      - https
fileAssociations:
  - ext:
      - html
      - htm
    name: HTML Document
    role: Viewer
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  icon: build/icon.png
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  category: Network
  target:
    - AppImage
    - deb
  mimeTypes:
    - x-scheme-handler/http
    - x-scheme-handler/https
    - text/html
publish:
  provider: github
  releaseType: draft
